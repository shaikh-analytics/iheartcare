{% load static %}
<div class="row g-0 bg-light rounded overflow-hidden">
    <div class="col-12 col-sm-5 h-100">
        {% if doctor.photo %}
        <img class="img-fluid h-100" src="{{ doctor.photo.url }}" style="object-fit: cover;">
        {% else %}
        <img class="img-fluid h-100" src="{% static 'core/img/team-1.jpg' %}" style="object-fit: cover;">
        {% endif %}
    </div>
    <div class="col-12 col-sm-7 h-100 d-flex flex-column">
        <div class="mt-auto p-4">
            <a href="{{ doctor.get_absolute_url }}" class="text-decoration-none text-body">
                <h3>{{ doctor.name }}</h3>
            </a>
            {% if doctor.designation %}
            <h6 class="fw-normal fst-italic text-primary mb-4">{{ doctor.designation }}</h6>
            {% endif %}
            <p class="m-0">{{ doctor.bio|default:"" }}</p>
        </div>
        <div class="d-flex mt-auto border-top p-4">
            <a class="btn btn-lg btn-primary btn-lg-square rounded-circle me-3" href="{{ doctor.twitter_url }}"><i
                    class="fab fa-twitter"></i></a>
            <a class="btn btn-lg btn-primary btn-lg-square rounded-circle me-3" href="{{ doctor.facebook_url }}"><i
                    class="fab fa-facebook-f"></i></a>
            <a class="btn btn-lg btn-primary btn-lg-square rounded-circle" href="{{ doctor.linkedin_url }}"><i
                    class="fab fa-linkedin-in"></i></a>
        </div>
    </div>
</div>
