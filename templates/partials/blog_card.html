{% load static %}
<div class="bg-light rounded overflow-hidden">
    {% if post.image %}
    <img class="img-fluid w-100" src="{{ post.image.url }}" alt="{{ post.title }}">
    {% else %}
    <img class="img-fluid w-100" src="{% static 'core/img/blog-1.jpg' %}" alt="{{ post.title }}">
    {% endif %}
    <div class="p-4">
        <a class="h3 d-block mb-3" href="{{ post.get_absolute_url }}">{{ post.title }}</a>
        <p class="m-0">{{ post.excerpt }}</p>
    </div>
    <div class="d-flex justify-content-between border-top p-4">
        <div class="d-flex align-items-center">
            <img class="rounded-circle me-2" src="{% static 'core/img/user.jpg' %}" width="25" height="25" alt="">
            <small>{{ post.author_name }}</small>
        </div>
        <div class="d-flex align-items-center">
            <small class="ms-3"><i class="far fa-eye text-primary me-1"></i>{{ post.views_count }}</small>
            <small class="ms-3"><i class="far fa-comment text-primary me-1"></i>{{ post.comments_count }}</small>
        </div>
    </div>
</div>
